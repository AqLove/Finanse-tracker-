<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance</title>
    <link rel="stylesheet" href="main_file.css">
    <!-- 1. Podklyuchaem biblioteku Lucide v head -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="main_container">

        <!-- Levoe menyu (Sidebar) -->
        <aside class="sidebar">
            <!-- Verkh: Logotip -->
            <div class="sidebar-top">
                <div class="logo-box">
                    <i data-lucide="landmark"></i>
                    <span class="logo-text">FinDashboard</span>
                </div>
            </div>

            <!-- Tsentr: Navigatsiya -->
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Overview</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="arrow-left-right"></i>
                    <span>Transactions</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="credit-card"></i>
                    <span>Cards</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="piggy-bank"></i>
                    <span>Savings</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <!-- Niz: Pomosch i knopka -->
            <div class="sidebar-bottom">
                <div class="help-box">
                    <p class="help-title">Need help?</p>
                    <a href="#" class="help-link">Get support <i data-lucide="external-link"></i></a>
                </div>
                <button class="btn-transfer">
                    <i data-lucide="plus"></i>
                    <span>New Transfer</span>
                </button>
            </div>
        </aside>

        <!-- Pravaya rabochaya oblast -->
        <div class="content_wrapper">

            <!-- Shapka -->
            <header class="top_header">
                <!-- Levaya chast: Pole poiska -->
                <div class="search_bar">
                    <i data-lucide="search"></i>
                    <input type="text" placeholder="Search transactions, cards..." class="search_input">
                </div>

                <!-- Pravaya chast: Uvedomleniya i profil -->
                <div class="header_right">
                    <!-- Kolokolchik s krasnoy tochkoy -->
                    <button class="notification_btn">
                        <i data-lucide="bell"></i>
                        <span class="notification_badge"></span>
                    </button>

                    <!-- Razdelitel -->
                    <div class="header_divider"></div>

                    <!-- Profil polzovatelya -->
                    <div class="user_profile">
                        <div class="user_info">
                            <span class="user_name">Your name</span>
                            <span class="user_status">Member</span>
                        </div>
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_p0olRw8ALYNZbeMpsiqflj4g6y4hvhOLptiwQ6Q7tF_XCnHdaPQRjpQ&s=10"
                            alt="Avatar" class="user_avatar">
                        <i data-lucide="chevron-down" class="profile_arrow"></i>
                    </div>
                </div>
            </header>

            <!-- Osnovnoe soderzhimoe dashborda -->
            <main class="dashboard_body">

                <!-- Levaya kolonka -->
                <div class="left_column">
                </div>

                <!-- Pravaya kolonka -->
                <div class="right_column">

                                <!-- Dinamicheskie polya dlya vyvoda vvedennyh dannyh -->
                                <p class="number" id="card-num-display">9759 2484 5269 6576</p>
                                <p class="valid_thru">VISA</p>
                                <p class="date_8264" id="card-date-display">12 / 24</p>
                                <p class="name" id="card-name-display">NARUTO UZUMAKI</p>
                            </div>
                            <div class="flip-card-back">
                                <div class="strip"></div>
                                <div class="mstrip"></div>
                                <div class="sstrip">
                                    <p class="code" id="card-cvv-display">***</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Knopka dobavleniya karty -->
                    <button class="btn-add-card" id="open-modal-btn">
                        <i data-lucide="plus-circle"></i>
                        <span>Add New Card</span>
                    </button>
                </div>

            </main>

        </div>

    </div>

    <!-- Modalnoe okno dlya vvod dannyh karty -->
    <div class="modal-overlay" id="card-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Bank Card</h3>
                <button class="close-modal-btn" id="close-modal-btn"><i data-lucide="x"></i></button>
            </div>
            <form id="add-card-form">
                <div class="form-group">
                    <label>Cardholder Name</label>
                    <input type="text" id="input-name" placeholder="e.g. Alex Johnson" required>
                </div>
                <div class="form-group">
                    <label>Card Number</label>
                    <input type="text" id="input-number" placeholder="1234 5678 9012 3456" maxlength="19" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Expiry Date</label>
                        <input type="text" id="input-date" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="form-group">
                        <label>CVV / CVC</label>
                        <input type="password" id="input-cvv" placeholder="123" maxlength="3" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit-card">Save Card</button>
            </form>
        </div>
    </div>

    <!-- 2. Inicializiruem ikonki pryamo pered zakryvayuschim body -->
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
